
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Language Dubber</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #10131c;
      color: white;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      margin: 30px auto;
      padding: 24px;
      background: #202637;
      border-radius: 16px;
    }
    select, input, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      box-sizing: border-box;
    }
    button {
      background: #7c5cff;
      color: white;
      border: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>🎬 Movie Language Dubber</h1>
  <p>Watch movies in your preferred language.</p>

  <div class="card">
    <h2>Start dubbing</h2>

    <input type="file" id="video" accept="video/*">

    <label for="language">Choose target language</label>
    <select id="language">
      <option value="te">Telugu</option>
      <option value="hi">Hindi</option>
      <option value="en">English</option>
      <option value="ta">Tamil</option>
    </select>

    <button onclick="startDubbing()">
      Start AI Dubbing
    </button>

    <p id="message">
      Upload a short video to get started.
    </p>
  </div>

  <script>
    function startDubbing() {
      const video = document.getElementById("video").files[0];
      const language = document.getElementById("language").value;
      const message = document.getElementById("message");

      if (!video) {
        message.textContent = "Please select a video first.";
        return;
      }

      message.textContent =
        "Video selected! Target language: " +
        language +
        ". AI dubbing backend will be connected next.";
    }
  </script>
</body>
</html>
